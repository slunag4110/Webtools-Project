
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>YTR Member Sign Up</title>

    <link rel="stylesheet" href="style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap"
          rel="stylesheet">
</head>

<body>

    <main class="page-shell">

        <section class="login-card" aria-label="YTR member sign up">

            <!-- LEFT: WELCOME PANEL -->
            <div class="welcome-panel">

                <div class="welcome-content">

                    <h1>Welcome!</h1>

                    <p class="welcome-subtitle">
                        Sign Up your YTR account
                    </p>

                    <span class="yellow-rule" aria-hidden="true"></span>

                    <p class="mission-text">
                        Together, we continue to<br>
                        <strong>Change a Nation by</strong><br>
                        <strong class="highlight">
                            Changing a Generation.
                        </strong>
                    </p>

                </div>

            </div>

            <!-- RIGHT: SIGN UP FORM -->
            <div class="form-panel">

                <div class="form-inner">

                    <header class="form-heading">
                        <h2>Sign Up</h2>
                        <p>Enter your account details to access all features.</p>
                    </header>

                    <form id="signupForm">

                        <!-- EMAIL OR USERNAME -->
                        <label class="input-wrap" for="emailUsername">

                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <rect x="3" y="5" width="18" height="14" rx="1.5"></rect>
                                <path d="m4 7 8 6 8-6"></path>
                            </svg>

                            <input
                                id="emailUsername"
                                name="emailUsername"
                                type="text"
                                placeholder="Email / Username"
                                autocomplete="username"
                                required
                            >

                        </label>

                        <!-- PASSWORD -->
                        <label class="input-wrap" for="password">

                            <svg viewBox="0 0 24 24" aria-hidden="true">
                                <rect x="5" y="10" width="14" height="11" rx="2"></rect>
                                <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
                                <path d="M12 14v3"></path>
                            </svg>

                            <input
                                id="password"
                                name="password"
                                type="password"
                                placeholder="Password"
                                autocomplete="new-password"
                                minlength="8"
                                required
                            >

                            <button
                                class="visibility-toggle"
                                type="button"
                                id="togglePassword"
                                aria-label="Show password"
                                title="Show password"
                            >
                                <svg viewBox="0 0 24 24" aria-hidden="true">
                                    <path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path>
                                    <circle cx="12" cy="12" r="2.5"></circle>
                                    <path class="slash" d="m4 3 16 18"></path>
                                </svg>
                            </button>

                        </label>

                        <!-- REMEMBER AND FORGOT PASSWORD -->
                        <div class="form-options">

                            <label class="remember">
                                <input type="checkbox" name="remember">
                                <span>Remember Me</span>
                            </label>

                            <a href="forgot-password.html"
                               class="text-link"
                               id="forgotLink">
                                Forgot Password?
                            </a>

                        </div>

                        <!-- SIGN UP BUTTON -->
                        <button class="login-button" type="submit">
                        Sign Up <span aria-hidden="true">→</span>
                        </button>

                        <!-- DIVIDER -->
                        <div class="separator">
                            <span></span>
                            <small>or</small>
                            <span></span>
                        </div>

                        <!-- GOOGLE SIGN UP -->
                        <button
                            class="google-button"
                            type="button"
                            id="googleButton"
                        >
                            <img
                                src="IMAGE/google-logo.png"
                                alt=""
                                class="google-logo"
                            >

                            <span>Continue with google</span>
                        </button>

                        <!-- LOGIN LINK -->
                        <p class="signup-prompt">
                        Already have an account?
                        <a href="logIn.html">Log in</a>
                        </p>

                        <!-- STATUS MESSAGE -->
                        <p
                            class="status-message"
                            id="statusMessage"
                            role="status"
                            aria-live="polite"
                        ></p>

                    </form>

                </div>

            </div>

        </section>

    </main>

    <script>
        const passwordInput = document.getElementById('password');
        const togglePassword = document.getElementById('togglePassword');
        const statusMessage = document.getElementById('statusMessage');

        // Show or hide the password
        togglePassword.addEventListener('click', () => {

            const isHidden = passwordInput.type === 'password';

            passwordInput.type = isHidden ? 'text' : 'password';

            togglePassword.setAttribute(
                'aria-label',
                isHidden ? 'Hide password' : 'Show password'
            );

            togglePassword.title = isHidden
                ? 'Hide password'
                : 'Show password';

            togglePassword.classList.toggle('is-visible', isHidden);
        });

        // Sign-up form demonstration
        document.getElementById('signupForm').addEventListener(
            'submit',
            (event) => {

                event.preventDefault();

                statusMessage.textContent =
                    'Demo only: connect this form to your registration system to create an account.';
            }
        );

        // Google registration demonstration
        document.getElementById('googleButton').addEventListener(
            'click',
            () => {

                statusMessage.textContent =
                    'Google sign-up needs to be connected to your authentication provider.';
            }
        );

        // Forgot password demonstration
        document.getElementById('forgotLink').addEventListener(
            'click',
            (event) => {

                event.preventDefault();

                statusMessage.textContent =
                    'Connect this link to your password-reset page.';
            }
        );
    </script>

</body>
</html>
