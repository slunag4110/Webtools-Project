<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YTR Member Login</title>
  <link rel="stylesheet" href="login style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <main class="page-shell">

<div class="login-overlay" id="loginOverlay">
    <section class="login-card" aria-label="YTR member login">
        <div class="welcome-panel">
        <div class="welcome-content">
          <h1>Welcome back!</h1>
          <p class="welcome-subtitle">Log in to your YTR account</p>
          <span class="yellow-rule" aria-hidden="true"></span>
          <p class="mission-text">
            Together, we continue to<br />
            <strong>Change a Nation by</strong><br />
            <strong class="highlight">Changing a Generation.</strong>
          </p>
        </div>
      </div>

      <div class="form-panel">
        <div class="form-inner">
          <header class="form-heading">
            <h2>Login</h2>
            <p>Enter your account details to continue.</p>
          </header>

          <form id="loginForm">
            <label class="input-wrap" for="email">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="1.5"></rect><path d="m4 7 8 6 8-6"></path></svg>
              <input id="email" name="email" type="email" placeholder="Email Address" autocomplete="email" required />
            </label>

            <label class="input-wrap password-wrap" for="password">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"></rect><path d="M8 10V7a4 4 0 0 1 8 0v3"></path><path d="M12 14v3"></path></svg>
              <input id="password" name="password" type="password" placeholder="Password" autocomplete="current-password" required />
              <button class="visibility-toggle" type="button" id="togglePassword" aria-label="Show password" title="Show password">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"></path><circle cx="12" cy="12" r="2.5"></circle><path class="slash" d="m4 3 16 18"></path></svg>
              </button>
            </label>

            <div class="form-options">
              <label class="remember"><input type="checkbox" name="remember" /> <span>Remember Me</span></label>
              <a href="#forgot-password" class="text-link" id="forgotLink">Forgot Password?</a>
            </div>

            <button class="login-button" type="submit">Login <span aria-hidden="true">→</span></button>

            <div class="separator"><span></span><small>or</small><span></span></div>

            
            <button class="google-button" type="button" id="googleButton">
              <img src="IMAGES/google-logo.png" alt="Google logo" class="google-logo">
              <span>Continue with Google</span>
            </button>


            <p class="signup-prompt">Don't have an account? <a href="#signup" id="signupLink">Sign Up</a></p>
            <p class="status-message" id="statusMessage" role="status" aria-live="polite"></p>
          </form>
        </div>
      </div>
    </section>
  </div>
  </main>
  <script>
    const passwordInput = document.getElementById('password');
    const togglePassword = document.getElementById('togglePassword');
    const statusMessage = document.getElementById('statusMessage');

    togglePassword.addEventListener('click', () => {
      const isHidden = passwordInput.type === 'password';
      passwordInput.type = isHidden ? 'text' : 'password';
      togglePassword.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
      togglePassword.title = isHidden ? 'Hide password' : 'Show password';
      togglePassword.classList.toggle('is-visible', isHidden);
    });

    document.getElementById('loginForm').addEventListener('submit', (event) => {
      event.preventDefault();
      statusMessage.textContent = 'Demo only: connect this form to your authentication system to log in.';
    });

    document.getElementById('googleButton').addEventListener('click', () => {
      statusMessage.textContent = 'Google sign-in needs to be connected to your authentication provider.';
    });
    document.getElementById('forgotLink').addEventListener('click', (event) => {
      event.preventDefault();
      statusMessage.textContent = 'Connect this link to your password-reset page.';
    });
    document.getElementById('signupLink').addEventListener('click', (event) => {
      event.preventDefault();
      statusMessage.textContent = 'Connect this link to your account registration page.';
    });
  </script>
</body>
</html>
